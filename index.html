<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Pelhřimov</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eef2f6; }
    canvas { display: block; }
    #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
      text-align: center; background: linear-gradient(#1b2735, #2b3a4a); z-index: 10; }
    #load h1 { margin: 0; font-size: 38px; letter-spacing: .04em; font-weight: 700; }
    #load p { margin: 0; opacity: .72; }
    #bar { width: 260px; height: 6px; border-radius: 3px; background: #ffffff22; overflow: hidden; margin: 0 auto; }
    #bar i { display: block; height: 100%; width: 0; background: #e8a33d; transition: width .25s; }
    #hud { position: fixed; left: 14px; bottom: 58px; font-size: 11px; opacity: .6;
      text-shadow: 0 1px 3px #000; pointer-events: none; }
    #attr { position: fixed; right: 12px; bottom: 12px; font-size: 11px; opacity: .55;
      text-shadow: 0 1px 3px #000; pointer-events: none; max-width: 46ch; text-align: right; }
    /* Na mobilu je dole knipl a minimapa, takže atribuce (ODbL ji vyžaduje)
       jde nahoru pod panel s cílem, ne do rohu, kde by se překrývala. */
    @media (max-width: 720px) {
      #attr { left: 0; right: 0; bottom: 0; top: auto; max-width: none; text-align: center;
        font-size: 9px; opacity: .8; padding: 3px 8px; background: rgba(10,14,20,.5); }
    }
  </style>
</head>
<body>
  <div id="load">
    <h1>Pelhřimov</h1>
    <p id="msg">načítám mapu…</p>
    <div id="bar"><i></i></div>
  </div>
  <div id="hud"></div>
  <div id="attr"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
